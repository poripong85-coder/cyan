<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 — 스테이 · 북스테이 · 갤러리 · 공방</title>
<meta name="description" content="시안. 시안스테이, 북스테이, 갤러리, 공방이 모여 있는 작은 마을.">
<meta name="theme-color" content="#F6F3EC">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="시안">
<meta property="og:description" content="시안스테이 · 북스테이 · 갤러리 · 공방">
<meta property="og:locale" content="ko_KR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/home.css">
</head>
<body>

<!-- 손그림 느낌을 내는 필터 (선이 살짝 떨리게) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="pen"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
</svg>

<div class="page">

  <!-- ───────── header : 🏠 시안. ───────── -->
  <header class="head">
    <a class="brand" href="index.html" aria-label="시안 홈">
      <svg class="brand-icon" viewBox="0 0 40 44" fill="none" aria-hidden="true">
        <g filter="url(#pen)" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 18 L20 5 L35 18"/>
          <path d="M7 16 V40 H33 V16"/>
          <rect x="14" y="22" width="12" height="9"/>
          <path d="M20 22 V31 M14 26.5 H26"/>
        </g>
      </svg>
      <span class="brand-word">시안<i>.</i></span>
    </a>
  </header>

  <main>

    <!-- ───────── map ───────── -->
    <section class="panel map" aria-labelledby="mapTitle">
      <h1 id="mapTitle" class="sr-only">시안 지도</h1>

      <!-- ✏️ 범례 : data-place 가 지도 속 같은 이름의 장소와 연결됩니다.
           href 를 채우면 클릭 시 그 페이지로 이동합니다. -->
      <ul class="legend">
        <li><a data-place="stay" href="#">
          <span>시안스테이</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#pen)"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="12" r="2.6"/><circle cx="15" cy="12" r="2.6"/></g></svg>
        </a></li>
        <li><a data-place="book" href="#">
          <span>북스테이</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#pen)"><path d="M6 3.5 H15 a4 4 0 0 1 0 8 a4.5 4.5 0 0 1 0 9 H6 Z"/><path d="M6 11.5 H14"/></g></svg>
        </a></li>
        <li><a data-place="gallery" href="gallery.html">
          <span>갤러리</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#pen)"><rect x="6" y="3" width="12" height="18" rx="1"/><path d="M9 15 l2.5-3 2 2 1.5-1.5 V17 H9 Z"/><circle cx="12" cy="8" r="1.3"/></g></svg>
        </a></li>
        <li><a data-place="craft" href="#">
          <span>공방</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#pen)"><path d="M9.5 3 H14.5 M10 3 V8 C5 9.5 4 13 4.5 16 C5.2 20 8.5 21.5 12 21.5 C15.5 21.5 18.8 20 19.5 16 C20 13 19 9.5 14 8 V3"/></g></svg>
        </a></li>
      </ul>

      <!-- 지도 그림 -->
      <svg class="map-art" viewBox="0 0 900 600" role="img" aria-label="강을 따라 시안스테이, 북스테이, 갤러리, 공방이 모여 있는 지도">
        <defs>
          <linearGradient id="riverFade" x1="0" y1="240" x2="0" y2="320" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/>
          </linearGradient>
          <mask id="riverMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="600"><rect width="900" height="600" fill="url(#riverFade)"/></mask>
        </defs>
        <g filter="url(#pen)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

          <!-- 강 -->
          <g class="river" mask="url(#riverMask)">
            <path class="river-water" d="M372 262 C356 320 346 372 360 410 C372 440 404 462 416 500 C424 528 424 560 426 600 L478 600 C476 560 476 530 470 505 C462 470 440 440 430 412 C410 365 410 300 416 250 Z"/>
            <path d="M372 262 C356 320 346 372 360 410 C372 440 404 462 416 500 C424 528 424 560 426 600"/>
            <path d="M416 250 C410 300 410 365 430 412 C440 440 462 470 470 505 C476 530 476 560 478 600"/>
          </g>

          <!-- 시안스테이 : 집 -->
          <a class="place" data-place="stay" href="#" aria-label="시안스테이">
            <rect class="hit" x="436" y="168" width="80" height="104"/>
            <path class="fill" d="M452 210 L476 186 L500 210 V259 H452 Z"/>
            <path d="M448 213 L476 186 L504 213"/>
            <path d="M453 209 V259 H499 V209"/>
            <rect x="466" y="222" width="20" height="16"/>
            <path d="M476 222 V238 M466 230 H486"/>
            <text class="tag" x="476" y="166">시안스테이</text>
          </a>

          <!-- 북스테이 : 뒤쪽 건물 -->
          <a class="place" data-place="book" href="#" aria-label="북스테이">
            <rect class="hit" x="520" y="232" width="74" height="60"/>
            <path class="fill" d="M533 264 H581 V292 H548 V300 H533 Z"/>
            <path d="M533 300 V264 H581 V292"/>
            <text class="tag" x="557" y="252">북스테이</text>
          </a>

          <!-- 갤러리 : 앞쪽 건물 -->
          <a class="place" data-place="gallery" href="gallery.html" aria-label="갤러리">
            <rect class="hit" x="526" y="290" width="104" height="58"/>
            <path class="fill" d="M548 293 H614 V331 H548 Z"/>
            <rect x="548" y="293" width="66" height="38"/>
            <path d="M533 296 V346"/>
            <text class="tag" x="581" y="364">갤러리</text>
          </a>

          <!-- 공방 : 자전거가 서 있는 곳 -->
          <a class="place" data-place="craft" href="#" aria-label="공방">
            <rect class="hit" x="560" y="400" width="110" height="88"/>
            <circle cx="590" cy="458" r="14"/>
            <circle cx="642" cy="455" r="15"/>
            <path d="M590 458 L606 436 L626 452 L642 455"/>
            <path d="M606 436 L590 458 H618"/>
            <path d="M612 412 L604 444"/>
            <path d="M600 418 L622 412"/>
            <path d="M626 452 L634 430 H646"/>
            <text class="tag" x="615" y="500">공방</text>
          </a>
        </g>
      </svg>
    </section>

    <!-- ───────── guestbook + seasonal photo ───────── -->
    <section class="panel guest" aria-labelledby="guestTitle">
      <div class="guest-book">
        <h2 id="guestTitle" class="guest-title">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17 C4 12.5 2 9.5 2 7 a4 4 0 0 1 8-1 a4 4 0 0 1 8 1 c0 2.5-2 5.5-8 10 Z"/></svg>
          방명록
        </h2>

        <form class="guest-form" id="guestForm" autocomplete="off">
          <label class="sr-only" for="gName">이름</label>
          <input id="gName" name="name" type="text" maxlength="20" placeholder="이름" required>
          <label class="sr-only" for="gMsg">남길 말</label>
          <textarea id="gMsg" name="msg" rows="2" maxlength="200" placeholder="시안에서의 하루를 남겨주세요" required></textarea>
          <button type="submit">남기기</button>
        </form>

        <ul class="guest-list" id="guestList" aria-live="polite"></ul>
      </div>

      <!-- ✏️ 계절별 사진 : assets/img/seasons/ 에 spring.jpg · summer.jpg · autumn.jpg · winter.jpg 를 넣으면 자동으로 보입니다 -->
      <figure class="season" id="season">
        <div class="season-frame">
          <img id="seasonImg" alt="">
          <div class="season-empty" id="seasonEmpty">
            <span id="seasonDoodle" aria-hidden="true"></span>
            <p>계절별<br>사진</p>
          </div>
        </div>
        <figcaption class="season-tabs" role="tablist" aria-label="계절 선택">
          <button role="tab" data-season="spring">봄</button>
          <button role="tab" data-season="summer">여름</button>
          <button role="tab" data-season="autumn">가을</button>
          <button role="tab" data-season="winter">겨울</button>
        </figcaption>
      </figure>
    </section>

  </main>

  <footer class="foot">© <span id="year">2026</span> 시안</footer>
</div>

<script src="assets/js/home.js" defer></script>
</body>
</html>
